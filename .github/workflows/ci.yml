name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: every job only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync --locked
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy app

  test:
    name: Tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.16-alpine
        env:
          POSTGRES_USER: phishtriage
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: phishtriage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phishtriage -d phishtriage_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync --locked
      - name: Sample emails match their generator
        run: uv run python scripts/generate_emails.py --check
      - name: pytest on SQLite (with coverage gate)
        run: uv run pytest --cov --cov-report=term-missing
      - name: pytest on PostgreSQL 16
        env:
          TEST_DATABASE_URL: postgresql+psycopg://phishtriage:ci-only-password@127.0.0.1:5432/phishtriage_test
        run: uv run pytest

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "uv==${UV_VERSION}"
      - name: Export the locked dependency set
        run: uv export --locked --all-groups --no-emit-project --format requirements-txt -o requirements-audit.txt
      - name: pip-audit
        # --disable-pip: audit exactly the pinned, hashed set from uv.lock, no re-resolution.
        run: uvx --from "pip-audit==2.10.1" pip-audit --strict --disable-pip -r requirements-audit.txt

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # scan the whole history, not just the last commit
          persist-credentials: false
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1
          git --redact --verbose --exit-code 1 .

  image-scan:
    name: Image scan (Trivy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --tag phishtriage:ci .
      - name: Trivy (HIGH and CRITICAL with a fix available)
        # Pinned by digest: a scanner runs with access to everything it scans. The image is
        # handed over as a tar file, so the scanner gets no access to the Docker socket.
        # Debian CVEs without a fixed package are listed but do not fail the build:
        # nothing can be upgraded until Debian ships the fix.
        run: |
          docker save phishtriage:ci -o image.tar
          docker run --rm -v "$PWD:/work" \
            aquasec/trivy:0.69.1@sha256:1c78ed1ef824ab8bb05b04359d186e4c1229d0b3e67005faacb54a7d71974f73 \
            image --input /work/image.tar --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 --no-progress

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-24.04
    env:
      API_TOKEN: ci-only-api-token-not-a-secret-0123456789
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Liveness and readiness
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/healthz
          curl --fail --silent --show-error http://127.0.0.1:8000/readyz
      - name: libmagic works inside the image
        run: >-
          docker compose exec -T web python -c
          "from app.parsing.filetype import detect_type as d; t = d(b'%PDF-1.4 x'); print(t); assert t == 'application/pdf'"
      - name: Submit a sample report through the API; the worker analyses it
        run: >-
          python3 scripts/submit_report.py --timeout 120 --expect-verdict malicious
          tests/fixtures/emails/02_html_link_mismatch_b64.eml
      - name: Log in to the console and see the report in the queue
        run: |
          printf '%s\n' 'ci-only-console-password' | docker compose exec -T web \
            python -m app.cli create-user ci@example.edu --password-stdin
          jar=$(mktemp)
          token=$(curl -fsS -c "$jar" -b "$jar" http://127.0.0.1:8000/login \
            | grep -o 'name="csrf_token" value="[0-9a-f]*"' | head -1 | cut -d'"' -f4)
          curl -fsS -o /dev/null -c "$jar" -b "$jar" \
            --data-urlencode "email=ci@example.edu" \
            --data-urlencode "password=ci-only-console-password" \
            --data-urlencode "csrf_token=$token" http://127.0.0.1:8000/login
          curl -fsS -c "$jar" -b "$jar" http://127.0.0.1:8000/reports | grep -q "Mailbox quota exceeded"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync --locked
      - name: Report by email; the reporter gets the verdict within a minute (M5 end to end)
        env:
          PHISHTRIAGE_BASE_URL: http://127.0.0.1:8000
          PHISHTRIAGE_API_TOKEN: ${{ env.API_TOKEN }}
        run: uv run pytest -m integration tests/integration -p no:cacheprovider
      - name: Report every sample; each gets a reply in Mailpit
        run: python3 scripts/send_sample.py --wait 120
      - name: Show state on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down --volumes
