name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: every job only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync --locked
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy app

  test:
    name: Tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.16-alpine
        env:
          POSTGRES_USER: phishtriage
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: phishtriage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phishtriage -d phishtriage_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync --locked
      - name: Sample emails match their generator
        run: uv run python scripts/generate_emails.py --check
      - name: pytest on SQLite (with coverage gate)
        run: uv run pytest --cov --cov-report=term-missing
      - name: pytest on PostgreSQL 16
        env:
          TEST_DATABASE_URL: postgresql+psycopg://phishtriage:ci-only-password@127.0.0.1:5432/phishtriage_test
        run: uv run pytest

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "uv==${UV_VERSION}"
      - name: Export the locked dependency set
        run: uv export --locked --all-groups --no-emit-project --format requirements-txt -o requirements-audit.txt
      - name: pip-audit
        # --disable-pip: audit exactly the pinned, hashed set from uv.lock, no re-resolution.
        run: uvx --from "pip-audit==2.10.1" pip-audit --strict --disable-pip -r requirements-audit.txt

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # scan the whole history, not just the last commit
          persist-credentials: false
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1
          git --redact --verbose --exit-code 1 .

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-24.04
    env:
      API_TOKEN: ci-only-api-token-not-a-secret-0123456789
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Liveness and readiness
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/healthz
          curl --fail --silent --show-error http://127.0.0.1:8000/readyz
      - name: libmagic works inside the image
        run: >-
          docker compose exec -T web python -c
          "from app.parsing.filetype import detect_type as d; t = d(b'%PDF-1.4 x'); print(t); assert t == 'application/pdf'"
      - name: Submit a sample report through the API
        run: |
          curl --fail --silent --show-error -o report.json \
            -H "Authorization: Bearer ${API_TOKEN}" -H "Content-Type: message/rfc822" \
            --data-binary @tests/fixtures/emails/02_html_link_mismatch_b64.eml \
            http://127.0.0.1:8000/api/reports
          python3 -c "import json; r = json.load(open('report.json')); print(r['id'], r['status']); assert r['status'] in ('queued', 'done'), r"
      - name: Show state on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down --volumes
