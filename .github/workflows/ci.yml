name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: every job only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync --locked
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy app

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync --locked
      - name: pytest (with coverage gate)
        run: uv run pytest --cov --cov-report=term-missing

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "uv==${UV_VERSION}"
      - name: Export the locked dependency set
        run: uv export --locked --all-groups --no-emit-project --format requirements-txt -o requirements-audit.txt
      - name: pip-audit
        # --disable-pip: audit exactly the pinned, hashed set from uv.lock, no re-resolution.
        run: uvx --from "pip-audit==2.10.1" pip-audit --strict --disable-pip -r requirements-audit.txt

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # scan the whole history, not just the last commit
          persist-credentials: false
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1
          git --redact --verbose --exit-code 1 .

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Liveness and readiness
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/healthz
          curl --fail --silent --show-error http://127.0.0.1:8000/readyz
      - name: Show state on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down --volumes
