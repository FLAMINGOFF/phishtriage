name: Public corpus evaluation

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Development only, or final evaluation after freezing the detector
        type: choice
        options: [dev, final]
        default: dev
  push:
    branches: [main]
    paths: [.github/workflows/public-corpus.yml, scripts/public_corpus.py]

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EVALUATION_PHASE: ${{ inputs.phase || 'final' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libmagic1
          pip install uv==0.11.32
          uv sync --locked
      - name: Verify evaluation regression tests
        run: uv run pytest tests/unit/test_evaluate.py tests/unit/test_verdicts.py tests/unit/test_public_corpus.py
      - name: Download checksum-pinned public corpora
        run: |
          curl --fail --location --retry 3 --max-time 180 https://monkey.org/~jose/phishing/phishing-2021 -o data/private/nazario-phishing-2021.mbox
          curl --fail --location --retry 3 --max-time 180 https://spamassassin.apache.org/old/publiccorpus/20030228_easy_ham.tar.bz2 -o data/private/easy_ham.tar.bz2
          curl --fail --location --retry 3 --max-time 180 https://spamassassin.apache.org/old/publiccorpus/20030228_hard_ham.tar.bz2 -o data/private/hard_ham.tar.bz2
          sha256sum --check <<'CHECKSUMS'
          636707cff42245d1482e4ae8a2c03369717a5e06bf9d1a0f4ec5dcd846661cee  data/private/nazario-phishing-2021.mbox
          2b7b65904bcfcc31d2b5f51946f2d261370b257402cbbd62930b46ab83367438  data/private/easy_ham.tar.bz2
          ce2ce67880643dbde65ea7f85bffbfe4417349c4bd80b6b0de56262ae6b0a9c9  data/private/hard_ham.tar.bz2
          CHECKSUMS
          if [ "$EVALUATION_PHASE" = final ]; then
            curl --fail --location --retry 3 --max-time 300 https://monkey.org/~jose/phishing/phishing-2025 -o data/private/nazario-phishing-2025.mbox
            echo 'f1fa7e0fe35c9a16f36d9aa20ade7e1d3908d1d0c1d917b8c53c8aa799ec1c8f  data/private/nazario-phishing-2025.mbox' | sha256sum --check
          fi
          tar -xjf data/private/easy_ham.tar.bz2 -C data/private
          tar -xjf data/private/hard_ham.tar.bz2 -C data/private
      - name: Evaluate offline and publish aggregate metrics only
        run: |
          uv run python scripts/public_corpus.py \
            --phase "$EVALUATION_PHASE" \
            --json data/private/metrics-detection.json \
            --markdown "$GITHUB_STEP_SUMMARY"
