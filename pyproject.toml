[project]
name = "phishtriage"
version = "0.1.0"
description = "Suspicious-email reporting and automated triage platform for SOC teams"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "FLAMINGOFF" }]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "idna>=3.20",
    "jinja2>=3.1.6",
    "nh3>=0.3.8",
    "oletools>=0.60.2",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.4",
    "rapidfuzz>=3.14.6",
    "redis>=8.2.0",
    "rq>=3.0.0",
    "sqlalchemy>=2.1.9",
    "stix2>=3.0.2",
    "tldextract>=5.4.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.41.0",
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.uv]
# This is an application, not a library: dependencies are installed, the code
# runs from the checkout (``python -m app...``), nothing is built or published.
package = false

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit: this project handles hostile input, so security lint is on
    "SIM",      # simplify
    "C4",       # comprehensions
    "DTZ",      # naive datetimes are a classic source of wrong timestamps
    "N",        # naming
    "PT",       # pytest style
    "RET",      # return statements
    "RUF",
]
ignore = ["N818"]  # "MessageRejected" reads better than "MessageRejectedError"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]  # asserts and fake secrets/paths are fine in tests
"scripts/**" = ["S101", "RUF001"]  # sample texts use full-width CJK punctuation

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["oletools.*", "stix2.*"]  # no type information published
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not live"]
markers = [
    "live: calls a real external API; skipped unless selected with -m live",
    "integration: needs the docker compose stack; skipped unless PHISHTRIAGE_BASE_URL is set",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
