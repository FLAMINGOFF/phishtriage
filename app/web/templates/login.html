{% extends "base.html" %}
{% block title %}Log in · PhishTriage{% endblock %}
{% block content %}
<article class="login">
  <h1>Log in</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Email
      <input type="email" name="email" value="{{ email }}" autocomplete="username" maxlength="320" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" maxlength="1024" required>
    </label>
    <button type="submit">Log in</button>
  </form>
  <p><small>Accounts are created by an administrator with <code>python -m app.cli create-user</code>.</small></p>
</article>
{% endblock %}
