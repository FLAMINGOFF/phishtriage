<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  {# htmx must not inject inline styles or eval anything: the CSP forbids both. #}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false}'>
  <title>{% block title %}PhishTriage{% endblock %}</title>
  <link rel="stylesheet" href="/static/vendor/pico-2.1.1.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/htmx-2.0.11.min.js" defer></script>
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><a href="/" class="brand"><strong>PhishTriage</strong></a></li></ul>
      <ul>
        {% block nav %}<li><a href="/upload">Upload .eml</a></li>{% endblock %}
      </ul>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
